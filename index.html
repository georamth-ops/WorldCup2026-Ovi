*{margin:0;padding:0;box-sizing:border-box}
:root{

  --bg:#07090F;--surface:#0F1623;--surface2:#161E2E;--surface3:#1D2840;
  --border:#1F2D47;--border2:#2E4070;
  --text:#EEF2FF;--text2:#7B8EC8;--text3:#3D4E70;--text4:#546080;

  --radius:14px;--radius-sm:9px;--radius-xs:6px;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(201,168,76,.07) 0%,transparent 60%);pointer-events:none;z-index:0}
#root{position:relative;z-index:1;min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--surface)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
h1,h2,h3{font-family:'Bebas Neue',sans-serif;letter-spacing:.05em}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--gold);margin-bottom:16px}
.app{display:flex;flex-direction:column;min-height:100vh}
.main{flex:1;padding:20px 16px 80px;max-width:1080px;margin:0 auto;width:100%}
.topbar{background:rgba(15,22,35,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100;gap:8px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);letter-spacing:.12em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo-badge{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#000;font-size:10px;padding:2px 7px;border-radius:20px;font-family:'DM Sans',sans-serif;font-weight:600}
.nav{display:flex;gap:2px;overflow-x:auto;flex-shrink:0}
.nav::-webkit-scrollbar{display:none}
.nav-btn{background:none;border:none;color:var(--text3);padding:6px 10px;border-radius:var(--radius-xs);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;transition:all .18s;white-space:nowrap;border-bottom:2px solid transparent}
.nav-btn:hover{color:var(--text2);background:var(--surface3)}
.nav-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.user-pill{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:24px;padding:5px 12px 5px 6px;flex-shrink:0}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#000;flex-shrink:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card-sm{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px}
.btn{border:none;padding:9px 18px;border-radius:var(--radius-sm);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;font-size:13px;transition:all .16s;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-gold{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#000;font-weight:600}
.btn-gold:hover:not(:disabled){filter:brightness(1.1)}
.btn-outline{background:none;border:1px solid var(--border2);color:var(--text2)}
.btn-outline:hover:not(:disabled){background:var(--surface3);color:var(--text)}
.btn-green{background:var(--green);color:#000;font-weight:600}
.btn-sm{padding:5px 11px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:10px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500}
.badge-gold{background:rgba(201,168,76,.18);color:var(--gold);border:1px solid rgba(201,168,76,.3)}
.badge-green{background:rgba(34,197,94,.12);color:#86EFAC}
.badge-blue{background:rgba(59,130,246,.12);color:#93C5FD}
.badge-orange{background:rgba(245,158,11,.12);color:#FCD34D}
.badge-gray{background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
.badge-live{background:rgba(239,68,68,.15);color:#FCA5A5;border:1px solid rgba(239,68,68,.3);display:inline-flex;align-items:center;gap:4px}
.alert{border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;margin-bottom:12px;line-height:1.5}
.alert-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#FCA5A5}
.alert-success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);color:#86EFAC}
.alert-info{background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.3);color:var(--gold)}
.input-group{margin-bottom:14px}
.input-group label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.input-group input,.input-group select{width:100%;background:var(--surface3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 13px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;transition:border-color .18s}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--gold)}
.input-group input::placeholder{color:var(--text3)}
select option{background:var(--surface3)}
.tab-bar{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;padding-bottom:1px}
.tab-bar::-webkit-scrollbar{display:none}
.tab{background:none;border:none;color:var(--text3);padding:8px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;transition:all .18s}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab:hover:not(.active){color:var(--text2)}
.match-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;transition:border-color .2s}
.match-card:hover{border-color:var(--border2)}
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.match-teams{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0}
.team-block{text-align:center;flex:1;min-width:70px}
.team-flag{font-size:26px;line-height:1;margin-bottom:4px}
.team-name{font-weight:600;font-size:12px;line-height:1.3;color:var(--text)}
.score-box{background:var(--surface3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:7px 14px;font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.1em;color:var(--gold);min-width:76px;text-align:center;flex-shrink:0}
.times-row{display:flex;gap:8px;justify-content:center;margin-top:4px;flex-wrap:wrap}
.time-chip{font-size:10px;color:var(--text3);background:var(--surface3);padding:2px 8px;border-radius:20px}
.venue-chip{font-size:10px;color:var(--text4);text-align:center;margin-top:3px}
.bid-buttons{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.bid-btn{flex:1;min-width:75px;padding:8px 6px;border-radius:var(--radius-sm);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;border:1px solid var(--border2);background:var(--surface3);color:var(--text2);transition:all .18s;text-align:center;line-height:1.4}

.bid-closed{margin-top:10px;text-align:center;font-size:11px;color:var(--text3);padding:6px;background:var(--surface3);border-radius:var(--radius-xs)}
.penalty-picker{margin-top:10px;background:var(--surface3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px}
.countdown-row{display:flex;gap:5px;margin-top:8px;align-items:center;flex-wrap:wrap}
.cd-label{font-size:10px;color:var(--text3)}

.group-table{width:100%;border-collapse:collapse;font-size:12px}
.group-table th{color:var(--text3);font-weight:500;padding:5px 6px;text-align:left;border-bottom:1px solid var(--border)}

.notif-bar{background:rgba(201,168,76,.07);border-bottom:1px solid rgba(201,168,76,.18);padding:8px 20px;font-size:12px;color:var(--gold);text-align:center}
.notif-item{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto}
.modal.resizable{resize:both;overflow:auto;min-width:300px}
.confetti-overlay{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.9)}
.confetti-piece{position:absolute;width:9px;height:9px;border-radius:2px;animation:cffall linear forwards}
@keyframes cffall{0%{transform:translateY(-30px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.trophy-anim{font-size:110px;animation:tbounce 1s ease infinite alternate;display:block}
@keyframes tbounce{0%{transform:scale(1) rotate(-4deg)}100%{transform:scale(1.08) rotate(4deg)}}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

.rules-fab:hover{transform:scale(1.1)}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.empty{text-align:center;padding:48px 20px;color:var(--text3)}

function useCountdown(utc){
  const [ms,setMs]=useState(new Date(utc)-new Date());
  useEffect(()=>{const t=setInterval(()=>setMs(new Date(utc)-new Date()),1000);return()=>clearInterval(t);},[utc]);
  if(ms<=0)return null;
  return{d:Math.floor(ms/86400000),h:Math.floor((ms%86400000)/3600000),m:Math.floor((ms%3600000)/60000),s:Math.floor((ms%60000)/1000),ms};
}

function AuthScreen({onLogin}){
  const [mode,setMode]=useState('login');
  const [form,setForm]=useState({username:'',passcode:'',email:''});
  const [err,setErr]=useState('');
  const [msg,setMsg]=useState('');
  const [loading,setLoading]=useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  const doLogin=async()=>{
    setErr('');setLoading(true);
    if(form.username.trim()===ADMIN_USER&&form.passcode===ADMIN_PASS){
      onLogin({id:'admin-static',username:ADMIN_USER,display_name:'Admin',points:0,is_admin:true,email:ADMIN_USER});
      setLoading(false);return;
    }
    const{data,error}=await sb.from('users').select('*').eq('username',form.username.trim()).eq('passcode',form.passcode).maybeSingle();
    setLoading(false);
    if(error||!data){setErr('Incorrect username or passcode.');return;}
    onLogin(data);
  };

  const doCreate=async()=>{
    setErr('');setMsg('');
    if(!form.username.trim()){setErr('Username is required.');return;}
    if(!form.passcode){setErr('Passcode is required.');return;}
    if(!form.email.trim()){setErr('Email is required.');return;}
    setLoading(true);
    try{
      const{data:ex,error:chkErr}=await sb.from('users').select('id').eq('username',form.username.trim()).maybeSingle();
      if(chkErr){setErr('DB error: '+chkErr.message);setLoading(false);return;}
      if(ex){setErr('Username already taken.');setLoading(false);return;}
      const{data,error}=await sb.from('users').insert({username:form.username.trim(),passcode:form.passcode,email:form.email.trim().toLowerCase(),display_name:form.username.trim(),points:0}).select().single();
      setLoading(false);
      if(error){setErr('Error: '+error.message+' ('+error.code+')');return;}
      if(!data){setErr('Created but login failed — try Sign In.');return;}
      onLogin(data);
    }catch(ex2){setLoading(false);setErr('Error: '+(ex2.message||String(ex2)));}
  };

  const doForgot=async()=>{
    setErr('');setMsg('');
    if(!form.email.trim()){setErr('Enter your recovery email.');return;}
    setLoading(true);
    const{data}=await sb.from('users').select('username').eq('email',form.email.trim().toLowerCase()).maybeSingle();
    setLoading(false);
    if(data)setMsg('Your username is: "'+data.username+'"');
    else setErr('No account found with that email.');
  };

  return e('div',{className:'auth-wrap'},
    e('div',{className:'auth-box'},
      e('div',{style:{textAlign:'center',marginBottom:24}},
        e('div',{style:{fontSize:54,marginBottom:8}},'🏆'),
        e('h1',{style:{fontFamily:'Bebas Neue',fontSize:34,color:'var(--gold)',letterSpacing:'.1em'}},'World Cup 2026'),
        e('p',{style:{color:'var(--text2)',fontSize:12,marginTop:4}},'Prediction League')
      ),
      e('div',{className:'card'},
        e('div',{className:'auth-tabs'},
          e('button',{className:'auth-tab'+(mode==='login'?' active':''),onClick:()=>{setMode('login');setErr('');setMsg('');}},  'Sign In'),
          e('button',{className:'auth-tab'+(mode==='create'?' active':''),onClick:()=>{setMode('create');setErr('');setMsg('');}}, 'Create Account'),
          e('button',{className:'auth-tab'+(mode==='forgot'?' active':''),onClick:()=>{setMode('forgot');setErr('');setMsg('');}}, 'Forgot?')
        ),
        err&&e('div',{className:'alert alert-error'},'⚠️ '+err),
        msg&&e('div',{className:'alert alert-success'},'✅ '+msg),
        mode==='login'&&e('div',null,
          e('div',{className:'input-group'},e('label',null,'Username'),e('input',{value:form.username,onChange:ev=>set('username',ev.target.value),placeholder:'your username'})),
          e('div',{className:'input-group'},e('label',null,'Passcode'),e('input',{type:'password',value:form.passcode,onChange:ev=>set('passcode',ev.target.value),placeholder:'••••••',onKeyDown:ev=>ev.key==='Enter'&&doLogin()})),
          e('button',{className:'btn btn-gold',style:{width:'100%',padding:'11px',justifyContent:'center'},onClick:doLogin,disabled:loading},loading?e(Spinner):'Sign In →')
        ),
        mode==='create'&&e('div',null,
          e('div',{className:'input-group'},e('label',null,'Username'),e('input',{value:form.username,onChange:ev=>set('username',ev.target.value),placeholder:'choose a username'})),
          e('div',{className:'input-group'},e('label',null,'Passcode'),e('input',{type:'password',value:form.passcode,onChange:ev=>set('passcode',ev.target.value),placeholder:'create a passcode'})),
          e('div',{className:'input-group'},e('label',null,'Recovery Email'),e('input',{type:'email',value:form.email,onChange:ev=>set('email',ev.target.value),placeholder:'your@email.com'})),
          e('button',{className:'btn btn-gold',style:{width:'100%',padding:'11px',justifyContent:'center'},onClick:doCreate,disabled:loading},loading?e(Spinner):'Create Account →')
        ),
        mode==='forgot'&&e('div',null,
          e('div',{className:'input-group'},e('label',null,'Recovery Email'),e('input',{type:'email',value:form.email,onChange:ev=>set('email',ev.target.value),placeholder:'your@email.com'})),
          e('button',{className:'btn btn-gold',style:{width:'100%',padding:'11px',justifyContent:'center'},onClick:doForgot,disabled:loading},loading?e(Spinner):'Find My Account →')
        )
      )
    )
  );
}

function CDDisplay({utc}){
  const cd=useCountdown(utc);
  if(!cd)return e('span',{style:{color:'var(--red)',fontSize:11}},'⏰ Match started');

  const handleDraw=()=>{if(opts.includes('penalty'))setShowPenalty(true);else placeBid('draw',null);};

function App(){
  const [user,setUser]=useState(null);
  const [tab,setTab]=useState('matches');
  const [stageFilter,setStageFilter]=useState('group48');
  const [matches,setMatches]=useState([]);
  const [allUsers,setAllUsers]=useState([]);
  const [userBids,setUserBids]=useState({});
  const [notifications,setNotifications]=useState([]);
  const [showRules,setShowRules]=useState(false);
  const [showConfetti,setShowConfetti]=useState(false);
  const [nudgeSent,setNudgeSent]=useState({});
  const [nudgeMsg,setNudgeMsg]=useState('');
  const [loading,setLoading]=useState(true);
  const [liveData,setLiveData]=useState('');
  const [fetchingLive,setFetchingLive]=useState(false);
  const [groupFilter,setGroupFilter]=useState('A');

  useEffect(()=>{
    const s=localStorage.getItem('wc2026_session');
    if(s){try{setUser(JSON.parse(s));}catch(ex){}}
    loadMatches();loadUsers();
  },[]);

  useEffect(()=>{
    if(!user)return;
    loadBids();
    if(user.id!=='admin-static')loadNotifications();
    const ch=sb.channel('wc2026-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'matches'},()=>loadMatches())
      .on('postgres_changes',{event:'*',schema:'public',table:'users'},()=>loadUsers())
      .on('postgres_changes',{event:'*',schema:'public',table:'bids'},()=>loadBids())
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications'},()=>{if(user.id!=='admin-static')loadNotifications();})
      .subscribe();
    return()=>sb.removeChannel(ch);
  },[user?.id]);

  const loadMatches=async()=>{
    const{data}=await sb.from('matches').select('*').order('utc');
    if(data&&data.length>0){setMatches(data);}
    else{
      // Seed official matches into Supabase if table is empty
      const toInsert=OFFICIAL_MATCHES.map(m=>({id:m.id,home:m.home,away:m.away,stage:m.stage,match_group:m.match_group,utc:m.utc,venue:m.venue,status:m.status,home_score:null,away_score:null,result:null,penalty_winner:null}));
      await sb.from('matches').upsert(toInsert,{onConflict:'id'});
      setMatches(OFFICIAL_MATCHES);
    }
    setLoading(false);
  };

  const loadUsers=async()=>{
    const{data}=await sb.from('users').select('id,username,display_name,points').order('points',{ascending:false});
    if(data)setAllUsers(data);
  };
  const loadBids=async()=>{
    if(!user||user.id==='admin-static')return;
    const{data}=await sb.from('bids').select('*').eq('user_id',user.id);
    if(data){const m={};data.forEach(b=>m[b.match_id]=b);setUserBids(m);}
  };
  const loadNotifications=async()=>{
    if(!user||user.id==='admin-static')return;
    const{data}=await sb.from('notifications').select('*').eq('to_user_id',user.id).eq('read',false).order('created_at',{ascending:false}).limit(5);
    if(data)setNotifications(data);
  };

  const handleLogin=u=>{setUser(u);localStorage.setItem('wc2026_session',JSON.stringify(u));};
  const handleLogout=()=>{setUser(null);localStorage.removeItem('wc2026_session');setUserBids({});setNotifications([]);};

  const handleBid=async(matchId,bidData)=>{
    if(!user||user.id==='admin-static')return;
    const{error}=await sb.from('bids').insert({user_id:user.id,match_id:matchId,...bidData,points_earned:0});
    if(!error)loadBids();
  };

  const handleAdminResult=async(matchId,af)=>{
    const match=matches.find(m=>m.id===matchId);if(!match)return;
    const hs=parseInt(af.homeScore)||0,as_=parseInt(af.awayScore)||0;
    let dbResult=af.result,penWinner=null;
    if(af.result==='draw_pen_home'){dbResult='draw';penWinner=match.home;}
    else if(af.result==='draw_pen_away'){dbResult='draw';penWinner=match.away;}
    await sb.from('matches').update({home_score:hs,away_score:as_,result:dbResult,penalty_winner:penWinner,status:'finished'}).eq('id',matchId);
    const{data:bids}=await sb.from('bids').select('*').eq('match_id',matchId);
    if(bids){
      for(const bid of bids){
        let pts=0;
        if(bid.bid_type===dbResult)pts+=3;
        if(dbResult==='draw'&&bid.penalty_team&&penWinner&&bid.penalty_team===penWinner)pts+=6;
        await sb.from('bids').update({points_earned:pts}).eq('id',bid.id);
        if(pts>0){const{data:u}=await sb.from('users').select('points').eq('id',bid.user_id).single();if(u)await sb.from('users').update({points:(u.points||0)+pts}).eq('id',bid.user_id);}
      }
    }
    const{data:allU}=await sb.from('users').select('id');
    if(allU){await sb.from('notifications').insert(allU.map(u=>({to_user_id:u.id,from_user:'System',message:'⚽ '+match.home+' '+hs+'–'+as_+' '+match.away+' — points updated!'})));}
    loadMatches();loadUsers();
  };

  const handleNudge=async t=>{
    if(!user)return;
    await sb.from('notifications').insert({to_user_id:t.id,from_user:user.display_name||user.username,message:'Hey '+(t.display_name||t.username)+'! 👋 Don\'t forget your predictions! ⚽'});
    setNudgeSent(n=>({...n,[t.id]:true}));
    setNudgeMsg('Nudge sent to '+(t.display_name||t.username)+'! 👋');
    setTimeout(()=>setNudgeMsg(''),3000);
  };
  const dismissNotif=async id=>{await sb.from('notifications').update({read:true}).eq('id',id);setNotifications(n=>n.filter(x=>x.id!==id));};

  const fetchLiveData=async()=>{
    setFetchingLive(true);
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,tools:[{type:'web_search_20250305',name:'web_search'}],messages:[{role:'user',content:'Search FIFA official website for World Cup 2026 latest results and upcoming matches. Give 4-6 bullet points with scores and dates.'}]})});
      const d=await res.json();
      const text=d.content?.filter(c=>c.type==='text').map(c=>c.text).join('\n')||'Check fifa.com for latest updates.';
      setLiveData(text);
    }catch(ex){setLiveData('Could not fetch data. Visit fifa.com directly.');}
    setFetchingLive(false);
  };

  if(!user)return e(AuthScreen,{onLogin:handleLogin});
  if(loading)return e('div',{className:'full-loader'},e('div',{style:{fontSize:52}},'🏆'),e(Spinner,{style:{width:32,height:32}}),e('p',{style:{color:'var(--text2)',fontSize:13}},'Loading…'));

  const currentPoints=allUsers.find(u2=>u2.id===user.id)?.points||user.points||0;
  const topUser=allUsers[0];
  const isChampion=topUser&&user&&topUser.id===user.id&&currentPoints>0;
  const filteredMatches=matches.filter(m=>m.stage===stageFilter);
  const groupMatches=matches.filter(m=>m.match_group===groupFilter&&m.stage==='group48');

  const TABS=[['matches','⚽ Matches'],['leaderboard','🏆 Board'],['groups','Group Teams'],['stages','All Stages'],['fifa','FIFA'],...(user.is_admin?[['admin','⚙️ Admin']]:[])] ;

  return e('div',{className:'app'},
    e('div',{className:'topbar'},
      e('div',{className:'logo'},e('span',null,'World Cup 2026'),e('span',{className:'logo-badge'},'PREDICTION LEAGUE')),
      e('div',{className:'nav'},...TABS.map(([id,lbl])=>e('button',{key:id,className:'nav-btn'+(tab===id?' active':''),onClick:()=>setTab(id)},lbl))),
      e('div',{className:'user-pill'},
        e('div',{className:'avatar'},(user.display_name||user.username)?.[0]?.toUpperCase()||'?'),
        e('span',{style:{fontSize:12,maxWidth:80,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},user.display_name||user.username),
        e('span',{className:'badge badge-gold',style:{fontSize:11}},currentPoints+' pts'),
        e('button',{className:'btn btn-xs btn-outline',onClick:handleLogout},'Out')
      )
    ),
    nudgeMsg&&e('div',{className:'notif-bar'},nudgeMsg),
    notifications.length>0&&e('div',{style:{background:'var(--surface2)',borderBottom:'1px solid var(--border)'}},
      ...notifications.slice(0,3).map(n=>e('div',{key:n.id,className:'notif-item'},
        e('span',{style:{fontSize:13}},'🔔'),
        e('span',{style:{flex:1,color:'var(--text2)'}},e('strong',{style:{color:'var(--text)'}},n.from_user),': '+n.message),
        e('button',{className:'btn btn-xs btn-outline',onClick:()=>dismissNotif(n.id)},'✕')
      ))
    ),
    e('div',{className:'main'},
      tab==='matches'&&e('div',null,
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:8}},
          e('h2',{className:'section-title',style:{margin:0}},'Matches'),
          e('button',{className:'btn btn-outline btn-sm',onClick:fetchLiveData,disabled:fetchingLive},fetchingLive?e(Spinner):'🔄 Live Update')
        ),
        liveData&&e('div',{className:'card-sm',style:{marginBottom:14,fontSize:12,color:'var(--text2)',lineHeight:1.75,whiteSpace:'pre-wrap'}},
          e('div',{style:{fontSize:10,color:'var(--gold)',fontWeight:600,marginBottom:5}},'LIVE DATA — FIFA.COM'),liveData
        ),
        e('div',{className:'tab-bar'},...STAGES.map(s=>e('button',{key:s.id,className:'tab'+(stageFilter===s.id?' active':''),onClick:()=>setStageFilter(s.id)},s.short))),
        stageFilter==='group48'&&e('div',{className:'tab-bar',style:{marginBottom:14}},
          ...Object.keys(GROUPS).map(g=>e('button',{key:g,className:'tab'+(groupFilter===g?' active':''),onClick:()=>setGroupFilter(g)},'Group '+g))
        ),
        (stageFilter==='group48'?groupMatches:filteredMatches).length===0
          ?e('div',{className:'empty'},e('div',{style:{fontSize:36,marginBottom:8}},'⚽'),e('p',null,'No matches in this group yet.'))
          :e('div',null,...(stageFilter==='group48'?groupMatches:filteredMatches).map(m=>e(MatchCard,{key:m.id,match:m,userBid:userBids[m.id]||null,onBid:handleBid,isAdmin:!!user.is_admin,onAdminResult:handleAdminResult})))
      ),
      tab==='leaderboard'&&e('div',null,
        isChampion&&e('div',{className:'alert alert-info',style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}},
          e('span',null,'🏆 You are #1!'),
          e('button',{className:'btn btn-gold btn-sm',onClick:()=>setShowConfetti(true)},'Celebrate 🎉')
        ),
        e(Leaderboard,{users:allUsers,currentUser:user,onNudge:handleNudge,nudgeSent})
      ),
      tab==='groups'&&e(GroupTeams),
      tab==='stages'&&e(AllStages,{matches}),
      tab==='fifa'&&e(FifaTab,{liveData,fetchingLive,onFetch:fetchLiveData}),
      tab==='admin'&&user.is_admin&&e(AdminPanel,{matches,allUsers,onAdminResult:handleAdminResult,stageFilter,setStageFilter})
    ),
    e('button',{className:'rules-fab',onClick:()=>setShowRules(true),title:'Bidding Rules'},'📋'),
    showRules&&e(RulesModal,{onClose:()=>setShowRules(false),resizable:true}),
    showConfetti&&e(Confetti,{onClose:()=>setShowConfetti(false)})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
