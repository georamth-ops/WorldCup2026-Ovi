<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Prediction League</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
/* ─── RESET & BASE ─────────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#C9A84C;--gold-light:#F0D080;--gold-dark:#7A5A00;--gold-glow:rgba(201,168,76,.35);
  --bg:#07090F;--surface:#0F1623;--surface2:#161E2E;--surface3:#1D2840;--surface4:#232F49;
  --border:#1F2D47;--border2:#2E4070;--border3:#3A5090;
  --text:#EEF2FF;--text2:#7B8EC8;--text3:#3D4E70;--text4:#546080;
  --green:#22C55E;--green-dim:rgba(34,197,94,.12);
  --red:#EF4444;--red-dim:rgba(239,68,68,.12);
  --blue:#3B82F6;--blue-dim:rgba(59,130,246,.12);
  --orange:#F59E0B;--orange-dim:rgba(245,158,11,.12);
  --purple:#8B5CF6;
  --radius:14px;--radius-sm:9px;--radius-xs:6px;
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --shadow-gold:0 0 24px rgba(201,168,76,.2);
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(201,168,76,.07) 0%,transparent 60%);pointer-events:none;z-index:0}
#root{position:relative;z-index:1;min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}

/* ─── TYPOGRAPHY ────────────────────────────────────────────────────────────── */
h1,h2,h3,.font-display{font-family:'Bebas Neue',sans-serif;letter-spacing:.05em}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--gold);margin-bottom:16px;letter-spacing:.08em}

/* ─── LAYOUT ────────────────────────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;min-height:100vh}
.main{flex:1;padding:20px 16px 80px;max-width:1080px;margin:0 auto;width:100%}

/* ─── TOPBAR ────────────────────────────────────────────────────────────────── */
.topbar{
  background:rgba(15,22,35,.92);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:0 16px;
  display:flex;align-items:center;justify-content:space-between;
  height:58px;position:sticky;top:0;z-index:100;gap:8px;
}
.logo{
  font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);
  letter-spacing:.12em;white-space:nowrap;display:flex;align-items:center;gap:8px;
}
.logo-badge{
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  color:#000;font-size:10px;padding:2px 7px;border-radius:20px;
  font-family:'DM Sans',sans-serif;font-weight:600;letter-spacing:.05em;
}
.nav{display:flex;gap:2px;overflow-x:auto;flex-shrink:0}
.nav::-webkit-scrollbar{display:none}
.nav-btn{
  background:none;border:none;color:var(--text3);padding:6px 11px;
  border-radius:var(--radius-xs);cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;
  transition:all .18s;white-space:nowrap;border-bottom:2px solid transparent;
}
.nav-btn:hover{color:var(--text2);background:var(--surface3)}
.nav-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.user-pill{
  display:flex;align-items:center;gap:7px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:24px;padding:5px 12px 5px 6px;flex-shrink:0;cursor:default;
}
.avatar{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#000;flex-shrink:0;
}

/* ─── CARDS ──────────────────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card-sm{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px}

/* ─── BUTTONS ────────────────────────────────────────────────────────────────── */
.btn{
  border:none;padding:9px 18px;border-radius:var(--radius-sm);cursor:pointer;
  font-family:'DM Sans',sans-serif;font-weight:500;font-size:13px;
  transition:all .16s;display:inline-flex;align-items:center;gap:6px;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-gold{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#000;font-weight:600}
.btn-gold:hover:not(:disabled){background:linear-gradient(135deg,#fff5cc,var(--gold-light));box-shadow:var(--shadow-gold)}
.btn-outline{background:none;border:1px solid var(--border2);color:var(--text2)}
.btn-outline:hover:not(:disabled){background:var(--surface3);border-color:var(--border3);color:var(--text)}
.btn-green{background:var(--green);color:#000;font-weight:600}
.btn-green:hover:not(:disabled){background:#16A34A}
.btn-red{background:var(--red);color:#fff}
.btn-sm{padding:5px 11px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:10px}

/* ─── BADGES ─────────────────────────────────────────────────────────────────── */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500}
.badge-gold{background:rgba(201,168,76,.18);color:var(--gold);border:1px solid rgba(201,168,76,.3)}
.badge-green{background:var(--green-dim);color:#86EFAC}
.badge-red{background:var(--red-dim);color:#FCA5A5}
.badge-blue{background:var(--blue-dim);color:#93C5FD}
.badge-orange{background:var(--orange-dim);color:#FCD34D}
.badge-gray{background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
.badge-live{background:rgba(239,68,68,.15);color:#FCA5A5;border:1px solid rgba(239,68,68,.3);display:flex;align-items:center;gap:4px}

/* ─── ALERTS ─────────────────────────────────────────────────────────────────── */
.alert{border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;margin-bottom:12px;line-height:1.5}
.alert-error{background:var(--red-dim);border:1px solid rgba(239,68,68,.35);color:#FCA5A5}
.alert-success{background:var(--green-dim);border:1px solid rgba(34,197,94,.35);color:#86EFAC}
.alert-info{background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.3);color:var(--gold)}

/* ─── INPUTS ─────────────────────────────────────────────────────────────────── */
.input-group{margin-bottom:14px}
.input-group label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.input-group input,.input-group select{
  width:100%;background:var(--surface3);border:1px solid var(--border2);
  border-radius:var(--radius-sm);padding:10px 13px;color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:14px;transition:border-color .18s;
}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--gold)}
.input-group input::placeholder{color:var(--text3)}
select option{background:var(--surface3)}

/* ─── TABS ───────────────────────────────────────────────────────────────────── */
.tab-bar{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;padding-bottom:1px}
.tab-bar::-webkit-scrollbar{display:none}
.tab{
  background:none;border:none;color:var(--text3);padding:8px 13px;
  cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;
  white-space:nowrap;border-bottom:2px solid transparent;transition:all .18s;
}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab:hover:not(.active){color:var(--text2)}

/* ─── MATCH CARD ─────────────────────────────────────────────────────────────── */
.match-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:12px;
  transition:border-color .2s,box-shadow .2s;
}
.match-card:hover{border-color:var(--border2);box-shadow:0 4px 20px rgba(0,0,0,.35)}
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px}
.match-teams{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0}
.team-block{text-align:center;flex:1;min-width:80px}
.team-flag{font-size:28px;line-height:1;margin-bottom:4px}
.team-name{font-weight:600;font-size:13px;line-height:1.3;color:var(--text)}
.score-box{
  background:var(--surface3);border:1px solid var(--border2);
  border-radius:var(--radius-sm);padding:8px 16px;
  font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.1em;
  color:var(--gold);min-width:80px;text-align:center;flex-shrink:0;
}
.times-row{display:flex;gap:10px;justify-content:center;margin-top:4px;flex-wrap:wrap}
.time-chip{font-size:10px;color:var(--text3);background:var(--surface3);padding:2px 8px;border-radius:20px}
.bid-buttons{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.bid-btn{
  flex:1;min-width:80px;padding:9px 8px;border-radius:var(--radius-sm);cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;
  border:1px solid var(--border2);background:var(--surface3);color:var(--text2);
  transition:all .18s;text-align:center;line-height:1.3;
}
.bid-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.06)}
.bid-btn.selected{background:rgba(201,168,76,.1);border-color:var(--gold);color:var(--gold)}
.bid-btn:disabled{opacity:.35;cursor:not-allowed}
.bid-result{
  margin-top:10px;background:rgba(201,168,76,.06);
  border:1px solid rgba(201,168,76,.2);border-radius:var(--radius-sm);
  padding:8px 12px;font-size:12px;color:var(--gold);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;
}
.bid-closed{
  margin-top:10px;text-align:center;font-size:11px;color:var(--text3);
  padding:6px;background:var(--surface3);border-radius:var(--radius-xs);
}
.penalty-picker{
  margin-top:10px;background:var(--surface3);border:1px solid var(--border2);
  border-radius:var(--radius-sm);padding:12px;
}
.countdown-row{display:flex;gap:5px;margin-top:8px;align-items:center;flex-wrap:wrap}
.cd-label{font-size:10px;color:var(--text3)}
.cd-chip{
  background:var(--surface3);padding:2px 7px;border-radius:4px;
  font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--orange);border:1px solid var(--border);
}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.1s infinite;display:inline-block;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.8)}}

/* ─── LEADERBOARD ─────────────────────────────────────────────────────────────── */
.lb-row{
  display:flex;align-items:center;gap:12px;padding:11px 14px;
  border-radius:var(--radius-sm);border:1px solid var(--border);
  margin-bottom:7px;transition:background .18s;
}
.lb-row:hover{background:var(--surface3)}
.lb-row.is-me{border-color:rgba(201,168,76,.3);background:rgba(201,168,76,.04)}
.rank{font-family:'Bebas Neue',sans-serif;font-size:22px;min-width:30px;color:var(--text3)}
.rank.r1{color:var(--gold)}
.rank.r2{color:#C0C0C0}
.rank.r3{color:#CD7F32}

/* ─── GROUP TABLE ─────────────────────────────────────────────────────────────── */
.group-table{width:100%;border-collapse:collapse;font-size:12px}
.group-table th{color:var(--text3);font-weight:500;padding:5px 6px;text-align:left;border-bottom:1px solid var(--border)}
.group-table td{padding:5px 6px;border-bottom:1px solid rgba(42,52,80,.4)}
.group-table tbody tr:hover td{background:rgba(255,255,255,.02)}

/* ─── FIFA LINKS ─────────────────────────────────────────────────────────────── */
.fifa-link{
  display:flex;align-items:center;gap:12px;background:var(--surface2);
  border:1px solid var(--border2);border-radius:var(--radius);padding:16px;
  text-decoration:none;color:var(--text);transition:all .2s;margin-bottom:10px;
}
.fifa-link:hover{border-color:var(--gold);background:var(--surface3);box-shadow:var(--shadow-gold)}

/* ─── NOTIFICATIONS ─────────────────────────────────────────────────────────── */
.notif-bar{
  background:rgba(201,168,76,.07);border-bottom:1px solid rgba(201,168,76,.18);
  padding:8px 20px;font-size:12px;color:var(--gold);text-align:center;
}
.notif-item{
  display:flex;align-items:center;gap:10px;padding:8px 14px;
  background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;
}

/* ─── MODAL ──────────────────────────────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--radius);padding:24px;width:100%;
  max-width:500px;max-height:88vh;overflow-y:auto;
}
.modal.resizable{resize:both;overflow:auto;min-width:300px;min-height:200px}

/* ─── CONFETTI / TROPHY ──────────────────────────────────────────────────────── */
.confetti-overlay{
  position:fixed;inset:0;z-index:300;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,.9);
}
.confetti-piece{position:absolute;width:9px;height:9px;border-radius:2px;animation:cffall linear forwards}
@keyframes cffall{0%{transform:translateY(-30px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.trophy-anim{font-size:110px;animation:tbounce 1s ease infinite alternate;display:block}
@keyframes tbounce{0%{transform:scale(1) rotate(-4deg) translateY(0)}100%{transform:scale(1.08) rotate(4deg) translateY(-8px)}}

/* ─── SPINNER ─────────────────────────────────────────────────────────────────── */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.full-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:18px}

/* ─── RULES FLOATING BTN ─────────────────────────────────────────────────────── */
.rules-fab{
  position:fixed;bottom:22px;right:22px;z-index:150;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  color:#000;border:none;width:50px;height:50px;border-radius:50%;
  font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 18px rgba(201,168,76,.5);transition:transform .18s;
}
.rules-fab:hover{transform:scale(1.1)}

/* ─── ADMIN ──────────────────────────────────────────────────────────────────── */
.admin-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);
  border-radius:20px;padding:3px 10px;font-size:11px;color:var(--gold);
}

/* ─── STAGE CARDS ────────────────────────────────────────────────────────────── */
.stage-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px}

/* ─── AUTH ───────────────────────────────────────────────────────────────────── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.auth-box{width:100%;max-width:400px}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .big-trophy{font-size:58px;margin-bottom:8px;display:block}
.auth-logo h1{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--gold);letter-spacing:.1em}
.auth-logo p{color:var(--text2);font-size:13px;margin-top:4px}
.auth-tabs{display:flex;gap:4px;margin-bottom:18px}
.auth-tab{flex:1;padding:8px;font-size:11px;border-radius:var(--radius-xs);border:1px solid var(--border);background:none;color:var(--text3);cursor:pointer;transition:all .16s;font-family:'DM Sans',sans-serif}
.auth-tab.active{background:var(--surface3);border-color:var(--gold);color:var(--gold)}
.auth-tab:hover:not(.active){color:var(--text2)}

/* ─── MISC ───────────────────────────────────────────────────────────────────── */
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
.empty .empty-icon{font-size:44px;margin-bottom:12px}
</style>
</head>

/* ══ HELPERS ══════════════════════════════════════════════════════════════════ */
const toUAE=utc=>{
  try{return new Date(utc).toLocaleString('en-GB',{timeZone:'Asia/Dubai',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+' UAE';}
  catch{return utc;}
};
const toUTC=utc=>{
  try{return new Date(utc).toLocaleString('en-GB',{timeZone:'UTC',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+' UTC';}
  catch{return utc;}
};

function useCountdown(utc){
  const [ms,setMs]=useState(new Date(utc)-new Date());
  useEffect(()=>{
    const t=setInterval(()=>setMs(new Date(utc)-new Date()),1000);
    return()=>clearInterval(t);
  },[utc]);
  if(ms<=0)return null;
  return{d:Math.floor(ms/86400000),h:Math.floor((ms%86400000)/3600000),m:Math.floor((ms%3600000)/60000),s:Math.floor((ms%60000)/1000),ms};
}

const calcPts=(bid,result,penaltyWinner)=>{
  if(!bid||!result)return null;
  let p=0;
  if(bid.bid_type===result)p+=3;
  if(result==='draw'&&bid.penalty_team&&penaltyWinner&&bid.penalty_team===penaltyWinner)p+=6;
  return p;
};

/* ══ AUTH SCREEN ════════════════════════════════════════════════════════════ */
function AuthScreen({onLogin}){
  const [mode,setMode]=useState('login');
  const [form,setForm]=useState({username:'',passcode:'',email:''});
  const [err,setErr]=useState('');
  const [msg,setMsg]=useState('');
  const [loading,setLoading]=useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  const doLogin=async()=>{
    setErr('');setLoading(true);
    // Admin shortcut
    if(form.username.trim()===ADMIN_USER&&form.passcode===ADMIN_PASS){
      onLogin({id:'admin-static',username:ADMIN_USER,display_name:'Admin',points:0,is_admin:true,email:ADMIN_USER});
      setLoading(false);return;
    }
    const{data,error}=await sb.from('users').select('*').eq('username',form.username.trim()).eq('passcode',form.passcode).maybeSingle();
    setLoading(false);
    if(error||!data){setErr('Incorrect username or passcode. Please try again.');return;}
    onLogin(data);
  };

  const doCreate=async()=>{
    setErr('');
    if(!form.username.trim()||!form.passcode||!form.email.trim()){setErr('All fields are required.');return;}
    setLoading(true);
    const{data:ex}=await sb.from('users').select('id').eq('username',form.username.trim()).maybeSingle();
    if(ex){setErr('That username is already taken. Choose another.');setLoading(false);return;}
    const{data,error}=await sb.from('users').insert({
      username:form.username.trim(),passcode:form.passcode,
      email:form.email.trim().toLowerCase(),display_name:form.username.trim(),points:0
    }).select().single();
    setLoading(false);
    if(error){setErr('Could not create account. Try again.');return;}
    onLogin(data);
  };

  const doForgot=async()=>{
    setErr('');setMsg('');
    if(!form.email.trim()){setErr('Enter your recovery email.');return;}
    setLoading(true);
    const{data}=await sb.from('users').select('username').eq('email',form.email.trim().toLowerCase()).maybeSingle();
    setLoading(false);
    if(data)setMsg(`Found it! Your username is: "${data.username}" — in a live deployment this would be emailed to you.`);
    else setErr('No account found with that email address.');
  };

  return(
    <div className="auth-wrap">
      <div className="auth-box">
        <div className="auth-logo">
          <span className="big-trophy">🏆</span>
          <h1>World Cup 2026</h1>
          <p>Prediction League — Bid. Score. Win.</p>
        </div>
        <div className="card">
          <div className="auth-tabs">
            {[['login','Sign In'],['create','Create Account'],['forgot','Forgot?']].map(([m,l])=>(
              <button key={m} className={`auth-tab${mode===m?' active':''}`} onClick={()=>{setMode(m);setErr('');setMsg('')}}>{l}</button>
            ))}
          </div>
          {err&&<div className="alert alert-error">⚠️ {err}</div>}
          {msg&&<div className="alert alert-success">✅ {msg}</div>}

          {mode==='login'&&<>
            <div className="input-group"><label>Username</label><input value={form.username} onChange={e=>set('username',e.target.value)} placeholder="your username"/></div>
            <div className="input-group"><label>Passcode</label><input type="password" value={form.passcode} onChange={e=>set('passcode',e.target.value)} placeholder="••••••" onKeyDown={e=>e.key==='Enter'&&doLogin()}/></div>
            <button className="btn btn-gold" style={{width:'100%',padding:'11px',fontSize:14,justifyContent:'center'}} onClick={doLogin} disabled={loading}>
              {loading?<><span className="spinner"/>Signing in...</>:'Sign In →'}
            </button>
          </>}

          {mode==='create'&&<>
            <div className="input-group"><label>Username</label><input value={form.username} onChange={e=>set('username',e.target.value)} placeholder="choose a unique username"/></div>
            <div className="input-group"><label>Passcode</label><input type="password" value={form.passcode} onChange={e=>set('passcode',e.target.value)} placeholder="create a passcode"/></div>
            <div className="input-group"><label>Recovery Email</label><input type="email" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="your@email.com"/></div>
            <button className="btn btn-gold" style={{width:'100%',padding:'11px',fontSize:14,justifyContent:'center'}} onClick={doCreate} disabled={loading}>
              {loading?<><span className="spinner"/>Creating...</>:'Create Account →'}
            </button>
          </>}

          {mode==='forgot'&&<>
            <p style={{fontSize:12,color:'var(--text2)',marginBottom:12}}>Enter the email you registered with and we'll look up your username.</p>
            <div className="input-group"><label>Recovery Email</label><input type="email" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="your@email.com"/></div>
            <button className="btn btn-gold" style={{width:'100%',padding:'11px',fontSize:14,justifyContent:'center'}} onClick={doForgot} disabled={loading}>
              {loading?<><span className="spinner"/>Searching...</>:'Find My Account →'}
            </button>
          </>}
        </div>
        <p style={{textAlign:'center',fontSize:11,color:'var(--text3)',marginTop:14}}>World Cup 2026 · USA · Canada · Mexico 🌍</p>
      </div>
    </div>
  );
}

/* ══ COUNTDOWN DISPLAY ═══════════════════════════════════════════════════════ */
function CDDisplay({utc}){
  const cd=useCountdown(utc);
  if(!cd)return<span style={{color:'var(--red)',fontSize:11,fontWeight:500}}>⏰ Match started</span>;
  return(
    <div className="countdown-row">
      <span className="cd-label">Closes in:</span>
      <span className="cd-chip">{cd.d}d</span>
      <span className="cd-chip">{String(cd.h).padStart(2,'0')}h</span>
      <span className="cd-chip">{String(cd.m).padStart(2,'0')}m</span>

  );
}

/* ══ MATCH CARD ══════════════════════════════════════════════════════════════ */
function MatchCard({match,userBid,onBid,isAdmin,onAdminResult}){
  const cd=useCountdown(match.utc);
  const isClosed=!cd||(cd.ms<300000);
  const opts=BID_OPTS[match.stage]||['win','draw'];
  const [showPenalty,setShowPenalty]=useState(false);
  const [saving,setSaving]=useState(false);
  const [showAdmin,setShowAdmin]=useState(false);
  const [af,setAf]=useState({homeScore:'',awayScore:'',result:'',penaltyWinner:''});

  const stage=STAGES.find(s=>s.id===match.stage);
  const pts=calcPts(userBid,match.result,match.penalty_winner);

  const placeBid=async(type,penTeam=null)=>{
    if(saving||userBid)return;
    setSaving(true);
    await onBid(match.id,{bid_type:type,penalty_team:penTeam});
    setSaving(false);
    setShowPenalty(false);
  };

  const handleWin=()=>placeBid('win');
  const handleAwayWin=()=>placeBid('away_win');
  const handleDraw=()=>{
    if(opts.includes('penalty')){setShowPenalty(true);}
    else placeBid('draw');
  };
  const handlePenalty=t=>{placeBid('draw',t);};

  const applyAdmin=async()=>{
    await onAdminResult(match.id,af);
    setShowAdmin(false);
  };

  return(
    <div className="match-card">
      {/* Header */}
      <div className="match-header">
        <div style={{display:'flex',gap:5,alignItems:'center',flexWrap:'wrap'}}>
          {stage&&<span className="badge badge-gray">{stage.short}</span>}
          {match.match_group&&<span className="badge badge-gray">Grp {match.match_group}</span>}
          {match.status==='live'&&<span className="badge badge-live"><span className="live-dot"/>LIVE</span>}
          {match.status==='finished'&&<span className="badge badge-gray">✓ Finished</span>}
        </div>
        {pts!==null&&(
          <span style={{fontSize:12,fontWeight:600,color:pts>0?'var(--green)':'var(--text3)'}}>
            {pts>0?`+${pts} pts`:'0 pts'}
          </span>
        )}
      </div>

      {/* Teams + Score */}
      <div className="match-teams">
        <div className="team-block">
          <div className="team-flag">{gf(match.home)}</div>
          <div className="team-name">{match.home}</div>
        </div>
        <div className="score-box">{match.home_score!=null?`${match.home_score} – ${match.away_score}`:'VS'}</div>
        <div className="team-block">
          <div className="team-flag">{gf(match.away)}</div>
          <div className="team-name">{match.away}</div>
        </div>
      </div>

      {/* Times */}
      <div className="times-row">
        <span className="time-chip">{toUTC(match.utc)}</span>
        <span className="time-chip">{toUAE(match.utc)}</span>
      </div>

      {/* Countdown */}
      {!userBid&&!isClosed&&<CDDisplay utc={match.utc}/>}

      {/* Existing bid */}
      {userBid&&(
        <div className="bid-result">
          <span>Your bid: <strong>
            {userBid.bid_type==='win'?`🏆 ${match.home} Win`:
             userBid.bid_type==='away_win'?`🏆 ${match.away} Win`:
             '🤝 Draw'}
            {userBid.penalty_team&&` + Penalty: ${userBid.penalty_team}`}
          </strong></span>
          {pts!==null&&<span style={{fontWeight:700,color:pts>0?'var(--green)':'var(--text3)'}}>→ {pts} pts</span>}
        </div>
      )}

      {/* Bid buttons */}
      {!userBid&&!isClosed&&(
        <div className="bid-buttons">
          <button className="bid-btn" onClick={handleWin} disabled={saving}>
            {saving?<span className="spinner"/>:<>{gf(match.home)}<br/>{match.home} Win</>}
          </button>
          <button className="bid-btn" onClick={handleDraw} disabled={saving}>
            {saving?<span className="spinner"/>:<>🤝<br/>Draw{opts.includes('penalty')&&<><br/><span style={{fontSize:9,color:'var(--text3)'}}>+penalty option</span></>}</>}
          </button>
          <button className="bid-btn" onClick={handleAwayWin} disabled={saving}>
            {saving?<span className="spinner"/>:<>{gf(match.away)}<br/>{match.away} Win</>}
          </button>
        </div>
      )}

      {/* Closed */}
      {!userBid&&isClosed&&match.status!=='finished'&&(
        <div className="bid-closed">🔒 Bidding closed for this match</div>
      )}

      {/* Penalty picker */}
      {showPenalty&&!userBid&&(
        <div className="penalty-picker">
          <p style={{fontSize:12,color:'var(--text2)',marginBottom:10}}>
            You picked <strong>Draw</strong>. Optionally pick a penalty winner for <strong style={{color:'var(--gold)'}}>+6 bonus points</strong>:
          </p>
          <div style={{display:'flex',gap:6'}}>
            <button className="bid-btn" style={{flex:1}} onClick={()=>handlePenalty(match.home)}>
              {gf(match.home)} {match.home}
            </button>
            <button className="bid-btn" style={{flex:1}} onClick={()=>handlePenalty(match.away)}>
              {gf(match.away)} {match.away}
            </button>
            <button className="bid-btn" style={{flex:1,fontSize:10,color:'var(--text3)'}} onClick={()=>handlePenalty(null)}>
              Skip penalty pick
            </button>
          </div>
        </div>
      )}

      {/* Admin panel */}
      {isAdmin&&(
        <div style={{marginTop:12,borderTop:'1px solid var(--border)',paddingTop:10}}>
          <button className="btn btn-outline btn-sm" onClick={()=>setShowAdmin(!showAdmin)}>
            ⚙️ {showAdmin?'Hide Admin':'Set Result'}
          </button>
          {showAdmin&&(
            <div style={{marginTop:10,display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              <div className="input-group"><label>Home Score</label><input type="number" min="0" value={af.homeScore} onChange={e=>setAf(f=>({...f,homeScore:e.target.value}))} placeholder="0"/></div>
              <div className="input-group"><label>Away Score</label><input type="number" min="0" value={af.awayScore} onChange={e=>setAf(f=>({...f,awayScore:e.target.value}))} placeholder="0"/></div>
              <div className="input-group" style={{gridColumn:'1/-1'}}>
                <label>Match Result</label>
                <select value={af.result} onChange={e=>setAf(f=>({...f,result:e.target.value,penaltyWinner:''}))}>
                  <option value="">— select result —</option>
                  <option value="win">{match.home} Win</option>
                  <option value="draw">Draw (no penalties)</option>
                  <option value="draw_pen_home">Draw → {match.home} wins penalties</option>
                  <option value="draw_pen_away">Draw → {match.away} wins penalties</option>
                  <option value="away_win">{match.away} Win</option>
                </select>
              </div>
              <button className="btn btn-green" style={{gridColumn:'1/-1',justifyContent:'center'}} onClick={applyAdmin}>
                ✓ Apply Result — Update All Points
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

          <h3 style={{fontFamily:'Bebas Neue',color:'var(--gold)',fontSize:19,letterSpacing:.06em}}>Live Update Feed</h3>
          <button className="btn btn-gold btn-sm" onClick={onFetch} disabled={fetchingLive}>
            {fetchingLive?<><span className="spinner"/>Fetching...</>:'🔄 Refresh'}
          </button>
        </div>
        {liveData?(
          <p style={{fontSize:13,color:'var(--text2)',lineHeight:1.75,whiteSpace:'pre-wrap'}}>{liveData}</p>
        ):(
          <p style={{fontSize:12,color:'var(--text3)'}}>Click Refresh to pull the latest FIFA World Cup 2026 match data via web search.</p>
        )}
      </div>
    </div>
  );
}

/* ══ ADMIN PANEL ════════════════════════════════════════════════════════════ */
function AdminPanel({matches,allUsers,onAdminResult,stageFilter,setStageFilter}){
  const filtered=matches.filter(m=>m.stage===stageFilter);
  return(
    <div>
      <h2 className="section-title">⚙️ Admin Panel</h2>
      <div className="alert alert-info" style={{marginBottom:18}}>
        Welcome, Admin. Set match results below — points are calculated and updated in Supabase in real-time for all users.
      </div>
      <div className="tab-bar">
        {STAGES.map(s=>(
          <button key={s.id} className={`tab${stageFilter===s.id?' active':''}`} onClick={()=>setStageFilter(s.id)}>{s.short}</button>
        ))}
      </div>
      {filtered.length===0&&<div className="empty"><div className="empty-icon">⚽</div><p>No matches in this stage.</p></div>}
      {filtered.map(m=>(
        <MatchCard key={m.id} match={m} userBid={null} onBid={()=>{}} isAdmin={true} onAdminResult={onAdminResult}/>
      ))}
      <hr className="divider"/>
      <h3 style={{color:'var(--text2)',fontSize:14,marginBottom:12,fontFamily:'Bebas Neue',letterSpacing:.06em}}>ALL USERS ({allUsers.length})</h3>
      {allUsers.sort((a,b)=>(b.points||0)-(a.points||0)).map((u,i)=>(
        <div key={u.id} className="card-sm" style={{marginBottom:6,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontSize:13,fontWeight:500}}>#{i+1} {u.display_name||u.username}</div>
            <div style={{fontSize:11,color:'var(--text3)'}}>{u.username}</div>
          </div>
          <span className="badge badge-gold">{u.points||0} pts</span>
        </div>
      ))}
    </div>
  );
}

/* ══ MAIN APP ═══════════════════════════════════════════════════════════════ */
function App(){
  const [user,setUser]=useState(null);
  const [tab,setTab]=useState('matches');
  const [stageFilter,setStageFilter]=useState('group48');
  const [matches,setMatches]=useState([]);
  const [allUsers,setAllUsers]=useState([]);
  const [userBids,setUserBids]=useState({});
  const [notifications,setNotifications]=useState([]);
  const [showRules,setShowRules]=useState(false);
  const [showConfetti,setShowConfetti]=useState(false);
  const [nudgeSent,setNudgeSent]=useState({});
  const [nudgeMsg,setNudgeMsg]=useState('');
  const [loading,setLoading]=useState(true);
  const [liveData,setLiveData]=useState('');
  const [fetchingLive,setFetchingLive]=useState(false);

  // ── Restore session
  useEffect(()=>{
    const stored=localStorage.getItem('wc2026_session');
    if(stored){try{setUser(JSON.parse(stored));}catch(e){}}
    loadMatches();
    loadUsers();
  },[]);

  // ── Real-time subscriptions after login
  useEffect(()=>{
    if(!user)return;
    loadBids();
    if(user.id!=='admin-static')loadNotifications();
    const ch=sb.channel('wc2026-realtime')
      .on('postgres_changes',{event:'*',schema:'public',table:'matches'},()=>loadMatches())
      .on('postgres_changes',{event:'*',schema:'public',table:'users'},()=>loadUsers())
      .on('postgres_changes',{event:'*',schema:'public',table:'bids'},()=>loadBids())
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications'},payload=>{
        if(payload.new?.to_user_id===user.id)loadNotifications();
      })
      .subscribe();
    return()=>sb.removeChannel(ch);
  },[user?.id]);

  const loadMatches=async()=>{
    const{data}=await sb.from('matches').select('*').order('utc');
    if(data)setMatches(data);
    setLoading(false);
  };

  const loadUsers=async()=>{
    const{data}=await sb.from('users').select('id,username,display_name,points').order('points',{ascending:false});
    if(data)setAllUsers(data);
  };

  const loadBids=async()=>{
    if(!user||user.id==='admin-static')return;
    const{data}=await sb.from('bids').select('*').eq('user_id',user.id);
    if(data){const m={};data.forEach(b=>m[b.match_id]=b);setUserBids(m);}
  };

  const loadNotifications=async()=>{
    if(!user||user.id==='admin-static')return;
    const{data}=await sb.from('notifications').select('*').eq('to_user_id',user.id).eq('read',false).order('created_at',{ascending:false}).limit(6);
    if(data)setNotifications(data);
  };

  const handleLogin=u=>{
    setUser(u);
    localStorage.setItem('wc2026_session',JSON.stringify(u));
  };

  const handleLogout=()=>{
    setUser(null);
    localStorage.removeItem('wc2026_session');
    setUserBids({});setNotifications([]);
  };

  const handleBid=async(matchId,bidData)=>{
    if(!user||user.id==='admin-static')return;
    const{error}=await sb.from('bids').insert({user_id:user.id,match_id:matchId,...bidData,points_earned:0});
    if(!error)loadBids();
  };

  // ── Admin: resolve result string into DB fields
  const parseResult=rf=>{
    // rf.result can be: 'win','away_win','draw','draw_pen_home','draw_pen_away'
    let result='draw',penaltyWinner=null;
    if(rf.result==='win'){result='win';}
    else if(rf.result==='away_win'){result='away_win';}
    else if(rf.result==='draw'){result='draw';}
    else if(rf.result==='draw_pen_home'){result='draw';/* penaltyWinner set below */}
    else if(rf.result==='draw_pen_away'){result='draw';}
    return{result,penaltyWinner};
  };

  const handleAdminResult=async(matchId,af)=>{
    const match=matches.find(m=>m.id===matchId);
    if(!match)return;
    const hs=parseInt(af.homeScore)||0;
    const as_=parseInt(af.awayScore)||0;

    let dbResult=af.result;
    let penWinner=null;
    if(af.result==='draw_pen_home'){dbResult='draw';penWinner=match.home;}
    else if(af.result==='draw_pen_away'){dbResult='draw';penWinner=match.away;}

    // Update match
    await sb.from('matches').update({
      home_score:hs,away_score:as_,
      result:dbResult,penalty_winner:penWinner,status:'finished'
    }).eq('id',matchId);

    // Recalculate all bids for this match
    const{data:bids}=await sb.from('bids').select('*').eq('match_id',matchId);
    if(bids){
      for(const bid of bids){
        let pts=0;
        if(bid.bid_type===dbResult)pts+=3;
        if(dbResult==='draw'&&bid.penalty_team&&penWinner&&bid.penalty_team===penWinner)pts+=6;
        // Update bid
        await sb.from('bids').update({points_earned:pts}).eq('id',bid.id);
        // Update user total points
        if(pts>0){
          const{data:u}=await sb.from('users').select('points').eq('id',bid.user_id).single();
          if(u)await sb.from('users').update({points:(u.points||0)+pts}).eq('id',bid.user_id);
        }
      }
    }
    loadMatches();loadUsers();

    // Notify all users that match ended
    const{data:allU}=await sb.from('users').select('id,display_name');
    if(allU){
      const notifs=allU.map(u=>({
        to_user_id:u.id,
        from_user:'System',
        message:`⚽ Match ended: ${match.home} ${hs}–${as_} ${match.away}. Points updated!`
      }));
      await sb.from('notifications').insert(notifs);
    }
  };

  const handleNudge=async(target)=>{
    if(!user)return;
    await sb.from('notifications').insert({
      to_user_id:target.id,
      from_user:user.display_name||user.username,
      message:`Hey ${target.display_name||target.username}! 👋 Don't forget to place your predictions! ⚽🏆`
    });
    setNudgeSent(n=>({...n,[target.id]:true}));
    setNudgeMsg(`Nudge sent to ${target.display_name||target.username}! 👋`);
    setTimeout(()=>setNudgeMsg(''),3500);
  };

  const dismissNotif=async id=>{
    await sb.from('notifications').update({read:true}).eq('id',id);
    setNotifications(n=>n.filter(x=>x.id!==id));
  };

  const fetchLiveData=async()=>{
    setFetchingLive(true);
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',max_tokens:800,
          tools:[{type:'web_search_20250305',name:'web_search'}],
          messages:[{role:'user',content:'Search the FIFA official website for the latest World Cup 2026 match schedule, upcoming fixtures, and any recent results or scores. Give me a concise 4-6 bullet point summary with dates, teams and scores where available.'}]
        })
      });
      const d=await res.json();
      const text=d.content?.filter(c=>c.type==='text').map(c=>c.text).join('\n')||'Check fifa.com for the latest updates.';
      setLiveData(text);
    }catch(e){setLiveData('Could not fetch live data. Please visit fifa.com directly for the latest scores and schedule.');}
    setFetchingLive(false);
  };

  if(!user)return<AuthScreen onLogin={handleLogin}/>;

  if(loading)return(
    <div className="full-loader">
      <span style={{fontSize:56}}>🏆</span>
      <div className="spinner" style={{width:34,height:34,borderWidth:3}}/>
      <p style={{color:'var(--text2)',fontSize:14}}>Loading World Cup 2026…</p>
    </div>
  );

  const currentPoints=allUsers.find(u2=>u2.id===user.id)?.points||user.points||0;
  const topUser=allUsers[0];
  const isChampion=topUser&&user&&topUser.id===user.id&&currentPoints>0;
  const filteredMatches=matches.filter(m=>m.stage===stageFilter);

  const TABS=[
    ['matches','⚽ Matches'],
    ['leaderboard','🏆 Leaderboard'],
    ['groups','Group Teams'],
    ['stages','All Stages'],
    ['fifa','FIFA'],
    ...(user.is_admin?[['admin','⚙️ Admin']]:[]),
  ];

  return(
    <div className="app">
      {/* ── Top Bar ── */}
      <div className="topbar">
        <div className="logo">
          <span>World Cup 2026</span>
          <span className="logo-badge">PREDICTION LEAGUE</span>
        </div>
        <div className="nav">
          {TABS.map(([id,lbl])=>(
            <button key={id} className={`nav-btn${tab===id?' active':''}`} onClick={()=>setTab(id)}>{lbl}</button>
          ))}
        </div>
        <div className="user-pill">
          <div className="avatar">{(user.display_name||user.username)?.[0]?.toUpperCase()||'?'}</div>
          <span style={{fontSize:12,maxWidth:90,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
            {user.display_name||user.username}
          </span>
          <span className="badge badge-gold" style={{padding:'2px 8px',fontSize:11}}>{currentPoints} pts</span>
          <button className="btn btn-xs btn-outline" onClick={handleLogout}>Out</button>
        </div>
      </div>

      {/* ── Nudge banner ── */}
      {nudgeMsg&&<div className="notif-bar">{nudgeMsg}</div>}

      {/* ── Notifications ── */}
      {notifications.length>0&&(
        <div style={{background:'var(--surface2)',borderBottom:'1px solid var(--border)'}}>
          {notifications.slice(0,3).map(n=>(
            <div key={n.id} className="notif-item">
              <span style={{fontSize:14}}>🔔</span>
              <span style={{flex:1,color:'var(--text2)'}}><strong style={{color:'var(--text)'}}>{n.from_user}</strong>: {n.message}</span>
              <button className="btn btn-xs btn-outline" onClick={()=>dismissNotif(n.id)}>✕</button>
            </div>
          ))}
        </div>
      )}

      {/* ── Main Content ── */}
      <div className="main">

        {/* MATCHES */}
        {tab==='matches'&&(
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:8}}>
              <h2 className="section-title" style={{margin:0}}>Matches</h2>
              <button className="btn btn-outline btn-sm" onClick={fetchLiveData} disabled={fetchingLive}>
                {fetchingLive?<><span className="spinner"/>Fetching...</>:'🔄 Live Update'}
              </button>
            </div>
            {liveData&&(
              <div className="card-sm" style={{marginBottom:14,fontSize:12,color:'var(--text2)',lineHeight:1.75,whiteSpace:'pre-wrap'}}>
                <div style={{fontSize:10,color:'var(--gold)',fontWeight:600,letterSpacing:.08em,marginBottom:6}}>LIVE DATA — FIFA.COM</div>
                {liveData}
              </div>
            )}
            <div className="tab-bar">
              {STAGES.map(s=>(
                <button key={s.id} className={`tab${stageFilter===s.id?' active':''}`} onClick={()=>setStageFilter(s.id)}>{s.short}</button>
              ))}
            </div>
            {filteredMatches.length===0?(
              <div className="empty"><div className="empty-icon">⚽</div><p>No matches scheduled for this stage yet.</p><p style={{fontSize:11,marginTop:6,color:'var(--text4)'}}>Admin adds matches via Supabase or the Admin panel.</p></div>
            ):filteredMatches.map(m=>(
              <MatchCard key={m.id} match={m} userBid={userBids[m.id]||null} onBid={handleBid} isAdmin={!!user.is_admin} onAdminResult={handleAdminResult}/>
            ))}
          </div>
        )}

        {/* LEADERBOARD */}
        {tab==='leaderboard'&&(
          <div>
            {isChampion&&(
              <div className="alert alert-info" style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
                <span>🏆 You are currently #1 on the leaderboard!</span>
                <button className="btn btn-gold btn-sm" onClick={()=>setShowConfetti(true)}>Celebrate 🎉</button>
              </div>
            )}
            <Leaderboard users={allUsers} currentUser={user} onNudge={handleNudge} nudgeSent={nudgeSent}/>
          </div>
        )}

        {/* GROUP TEAMS */}
        {tab==='groups'&&<GroupTeams/>}

        {/* ALL STAGES */}
        {tab==='stages'&&<AllStages matches={matches}/>}

        {/* FIFA */}
        {tab==='fifa'&&<FifaTab liveData={liveData} fetchingLive={fetchingLive} onFetch={fetchLiveData}/>}

        {/* ADMIN */}
        {tab==='admin'&&user.is_admin&&(
          <AdminPanel matches={matches} allUsers={allUsers} onAdminResult={handleAdminResult} stageFilter={stageFilter} setStageFilter={setStageFilter}/>
        )}

      </div>

      {/* ── Floating Rules Button ── */}
      <button className="rules-fab" onClick={()=>setShowRules(true)} title="View Bidding Rules">📋</button>

      {/* ── Modals ── */}
      {showRules&&<RulesModal onClose={()=>setShowRules(false)} resizable/>}
      {showConfetti&&<Confetti onClose={()=>setShowConfetti(false)}/>}
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
